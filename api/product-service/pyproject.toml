[project]
name = "product-service"
description = "Product management API (Catalog microservice) for the cloud-native e-commerce platform"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "E-Commerce Platform Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "slowapi>=0.1.9",
    "packaging>=23.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyright>=1.1.360",
    "types-python-jose>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/product_service/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/product_service"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "C901", "UP",
    "ANN", "SIM", "RET", "ARG",
    "PLE", "PLW", "PLR", "RUF",
]
ignore = ["ANN003", "ANN401", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# FastAPI's dependency-injection idiom puts Depends()/Query()/Path() calls in argument
# defaults; whitelist them so B008 ("function call in default argument") is not raised.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.security.HTTPBearer",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-q"]

[tool.coverage.run]
source = ["product_service"]
omit = ["src/product_service/__init__.py"]
